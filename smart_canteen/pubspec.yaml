name: smart_canteen
description: "A real-time Smart Canteen Management Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  socket_io_client: ^3.0.0
  go_router: ^13.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  fl_chart: ^0.66.0
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.1.0
  image_picker: ^1.0.7
  intl: ^0.19.0
  connectivity_plus: ^6.0.1
  flutter_local_notifications: ^18.0.0
  lottie: ^3.1.0
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
